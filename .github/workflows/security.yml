name: Dependency security
on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/security.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/security.yml']
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=moderate
