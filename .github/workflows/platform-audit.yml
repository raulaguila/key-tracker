name: Platform audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/platform-audit.yml'
      - 'scripts/platform-audit.cjs'
      - 'app/**'
      - 'native/**'
      - 'build/**'
      - 'linux/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Audit Linux runtime
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/platform-audit.cjs
        env:
          DOBRA_UI_NO_SANDBOX: '1'
      - name: Audit Windows and macOS runtime
        if: runner.os != 'Linux'
        run: node scripts/platform-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-audit-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/os-audit/platform-*.json
          if-no-files-found: warn
