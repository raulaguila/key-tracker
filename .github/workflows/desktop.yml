name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm run check
      - run: npm test
      - name: Install Linux input test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 libevdev2 libudev1 dbus
      - name: Verify Wayland service on a private bus
        if: runner.os == 'Linux'
        run: npm run test:wayland
      - name: Verify Wayland macro portal contract on a private bus
        if: runner.os == 'Linux'
        run: dbus-run-session -- /usr/bin/python3 -I -B scripts/wayland-macro-portal-smoke.py
      - name: Verify lifecycle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:lifecycle
        env:
          DOBRA_UI_NO_SANDBOX: '1'
      - name: Verify lifecycle on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:lifecycle
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/lifecycle/*.json
          if-no-files-found: warn
      - name: Verify bounded stability workload
        run: npm run test:soak
      - name: Verify UI flows in Electron
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:ui
        env:
          DOBRA_UI_NO_SANDBOX: '1'
      - name: Verify native key moments in isolated X11
        if: runner.os == 'Linux'
        run: npm run test:input
        env:
          DOBRA_UI_NO_SANDBOX: '1'
      - name: Verify macro editor and native replay/recording in isolated X11
        if: runner.os == 'Linux'
        run: npm run test:macros
        env:
          DOBRA_UI_NO_SANDBOX: '1'
      - name: Build native installer
        if: github.event_name != 'pull_request'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dobra-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - name: Verify Linux input installation payload
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: node scripts/check-linux-input-package.cjs
      - name: Verify packaged runtime on Linux
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        run: xvfb-run -a node scripts/platform-audit.cjs --packaged
        env:
          DOBRA_UI_NO_SANDBOX: '1'
      - name: Verify packaged runtime on Windows and macOS
        if: github.event_name != 'pull_request' && runner.os != 'Linux'
        run: node scripts/platform-audit.cjs --packaged
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: packaged-runtime-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/os-audit/*-packaged.json
          if-no-files-found: warn
