<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Keyboard Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <div class="brand"><span class="brand-symbol" aria-hidden="true">⌘</span><span>Keyboard<br><strong>Tracker</strong></span></div>
        <nav id="navigation">
          <button type="button" data-view="layers" aria-current="page"><span aria-hidden="true">▱</span> Camadas</button>
          <button type="button" data-view="tracking"><span aria-hidden="true">⌨</span> Rastreio</button>
          <button type="button" data-view="history"><span aria-hidden="true">↻</span> Histórico</button>
          <button type="button" data-view="settings"><span aria-hidden="true">⚙</span> Configurações</button>
        </nav>
        <div class="sidebar-footer"><span class="device-label">Seu teclado, suas ações.</span><span id="platform-label">Aplicativo desktop</span></div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="engine-status"><span id="engine-dot" class="status-dot"></span><span id="engine-status" role="status">Carregando aplicativo…</span></div>
          <div class="topbar-actions"><span id="active-layer-label" class="active-layer-label"></span><button id="engine-toggle" class="button primary" type="button" disabled>Ativar ações</button></div>
        </header>
        <div id="notice" class="notice" role="alert" hidden></div>
        <main id="main" tabindex="-1"><div class="loading-state" aria-busy="true"><div class="skeleton heading-skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></main>
      </div>
    </div>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
  </body>
</html>
