<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Dobra</title>
    <script src="appearance.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
        <div class="brand" aria-label="Dobra"><svg class="brand-mark" viewBox="0 0 64 64" width="24" height="24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10 6h23v22h22v15c0 9-6 15-15 15H10V6Zm13 16v23h14c4 0 6-2 6-6v-8l-9-9H23Z"/><path d="M33 6v22h22L33 6Z" fill="currentColor" opacity=".38"/></svg><span>dobra</span></div>
        <nav id="navigation">
          <button type="button" data-view="layers" aria-current="page">Camadas</button>
          <button type="button" data-view="tracking">Rastreio</button>
          <button type="button" data-view="history">Histórico</button>
          <button type="button" data-view="settings">Configurações</button>
        </nav>
        <div class="sidebar-bottom">
          <button id="theme-toggle" class="button quiet" type="button" aria-label="Alternar tema"></button>
          <button id="sidebar-toggle" class="button quiet" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Recolher menu"></button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <strong id="page-name">Camadas</strong>
          <div class="topbar-actions"><div class="engine-status status-indicator" data-status="starting"><span id="engine-dot" class="status-dot" aria-hidden="true"></span><strong id="engine-status" role="status" aria-describedby="engine-detail">Carregando…</strong></div><button id="engine-toggle" class="button" type="button" disabled>Ativar ações</button></div>
        </header>
        <div id="notice" class="notice" role="alert" hidden></div>
        <div id="shortcut-warning" class="shortcut-warning" role="status" hidden></div>
        <main id="main" tabindex="-1"><div class="loading-state" aria-busy="true"><div class="skeleton heading-skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></main>
        <footer class="statusbar"><label class="active-layer-context" for="active-layer-picker">Em uso: <strong id="active-layer-label" class="sr-only">—</strong><select id="active-layer-picker" aria-label="Camada em uso"></select></label><span id="control-shortcuts"></span><span id="engine-detail" class="sr-only">Preparando suas camadas</span><span id="platform-label">Aplicativo desktop</span></footer>
      </div>
    </div>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"></dialog>
  </body>
</html>
